[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "business-insight-agent"
version = "0.1.0"
description = "Recoverable business analysis workflows with human approval"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "langgraph>=1.1,<2", "langgraph-checkpoint-sqlite>=3,<4", "fastmcp>=3,<4", "sqlglot>=26,<31", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

