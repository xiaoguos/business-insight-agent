[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "business-insight-agent"
version = "1.0.0"
description = "Recoverable business analysis workflows with human approval"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.141,<1", "uvicorn>=0.53,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2", "python-multipart>=0.0.20", "sqlalchemy>=2.0.54,<3", "psycopg[binary]>=3.3,<4", "pwdlib[argon2]>=0.3,<1", "alembic>=1.20,<2", "langgraph>=1.2,<2", "langgraph-checkpoint-sqlite>=3,<4", "fastmcp>=3.4,<4", "sqlglot>=30,<31"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
